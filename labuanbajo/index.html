<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Video Concept</title>
    
    <!-- Importing 'Caveat' from Google Fonts for a premium, clean handwritten feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #faf9f6; /* Soft, warm paper tone */
            color: #2c3e50;
            font-family: 'Caveat', cursive; 
            font-size: 26px; /* Optimized scale for reading script comfortably */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 420px; /* Constrains layouts beautifully for vertical video feeds */
            width: 100%;
            text-align: center;
        }

        .personal-note {
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            margin-bottom: 25px;
            border: 1px solid #f0ede6;
            text-align: left;
            line-height: 1.3;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #111;
            font-size: 38px;
        }

        /* 9:16 Vertical Video Aspect Ratio Box */
        .video-player-frame {
            position: relative;
            width: 100%;
            padding-top: 177.78%; /* Forces exact vertical standard height proportions */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            background-color: #000;
        }

        .video-player-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Personal Note Card -->
        <div class="personal-note">
            <h1>Hey Boss,</h1>
            <p>Take a look at the hook right at the beginning of this clip. I think adapting this style of format for our upcoming project rollout could give us exactly the engagement lift we're targeting.</p>
            <p style="text-align: right; margin-top: 20px; margin-bottom: 0; font-weight: 700;">— Hafiz</p>
        </div>

        <!-- Autoplaying Video Embed Grid Container -->
        <div class="video-player-frame">
            <!-- 
              Converted to standard embed layout.
              Autoplay + Mute parameters are chained to bypass modern browser restrictions.
              The playlist parameter matches the ID to enforce native looping behavior.
            -->
            <iframe 
                src="https://www.youtube.com/embed/EZdZ0c2XYjA?autoplay=1&mute=1&loop=1&playlist=EZdZ0c2XYjA&rel=0&modestbranding=1" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
        </div>

    </div>

</body>
</html>
