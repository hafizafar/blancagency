# Friend-laptop demo copy of Siapsiaga — fully self-contained, no source tree
# or git checkout needed. Pulls prebuilt images from GHCR (see
# .github/workflows/publish-friend-images.yml for how they're published).
#
# Setup: see docs/implementation/FRIEND_LAPTOP_SETUP.md
# Update: double-click update.bat (docker compose pull && docker compose up -d)
#
# This file is meant to be renamed to docker-compose.yml on the friend's
# machine, alongside a filled-in .env (never committed to this repo — see
# FRIEND_LAPTOP_SETUP.md for how it's generated) and the local self-signed
# cert pair from docker/certs/local/.

services:
  backend:
    restart: unless-stopped
    image: ghcr.io/hafizafar/siapsiaga-backend:latest
    environment:
      APP_NAME: ${APP_NAME:-Siapsiaga}
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://localhost:8443}
      API_VERSION: ${API_VERSION:-}
      APP_KEY: ${APP_KEY:-}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8443}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:8443}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siapsiaga_friend}
      DB_USERNAME: ${DB_USERNAME:-siapsiaga}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@siapsiaga.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
      REVERB_APP_ID: ${REVERB_APP_ID:-friend-app}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-friend-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      VITE_API_BASE_URL: https://localhost:8443
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-friend-key}
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8443
      VITE_REVERB_SCHEME: https
      VITE_REVERB_PATH: /app
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
      MAIL_MAILER: log
      MAIL_SCHEME: "null"
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 2525
      MAIL_USERNAME: "null"
      MAIL_PASSWORD: "null"
      MAIL_FROM_ADDRESS: hello@example.com
      UPLOAD_DISK: public
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_BUCKET: ""
      AWS_URL: ""
      AWS_ENDPOINT: ""
      AWS_USE_PATH_STYLE_ENDPOINT: "false"
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    restart: unless-stopped
    image: ghcr.io/hafizafar/siapsiaga-backend:latest
    command: ["/usr/local/bin/start-horizon-standalone.sh"]
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-https://localhost:8443}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siapsiaga_friend}
      DB_USERNAME: ${DB_USERNAME:-siapsiaga}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: log
      MAIL_SCHEME: "null"
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 2525
      MAIL_USERNAME: "null"
      MAIL_PASSWORD: "null"
      MAIL_FROM_ADDRESS: hello@example.com
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@siapsiaga.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    restart: unless-stopped
    image: ghcr.io/hafizafar/siapsiaga-backend:latest
    command: ["/usr/local/bin/start-scheduler-standalone.sh"]
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-https://localhost:8443}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siapsiaga_friend}
      DB_USERNAME: ${DB_USERNAME:-siapsiaga}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID:-friend-app}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-friend-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@siapsiaga.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    restart: unless-stopped
    image: ghcr.io/hafizafar/siapsiaga-backend:latest
    command: ["/usr/local/bin/start-reverb-standalone.sh"]
    environment:
      APP_ENV: local
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siapsiaga_friend}
      DB_USERNAME: ${DB_USERNAME:-siapsiaga}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@siapsiaga.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID:-friend-app}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-friend-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    image: ghcr.io/hafizafar/siapsiaga-frontend:latest

  nginx:
    restart: unless-stopped
    image: ghcr.io/hafizafar/siapsiaga-nginx:latest
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      APP_ENV: local
      NGINX_SERVER_NAME: localhost
      NGINX_ROOT_PATH: /
      FRONTEND_UPSTREAM: frontend:5173
      BACKEND_UPSTREAM: backend:8000
      REVERB_UPSTREAM: reverb:8080
    volumes:
      - ./certs:/etc/nginx/local-certs
      - app_storage:/var/www/storage:ro
    depends_on:
      - backend
      - frontend
      - reverb

  database:
    restart: unless-stopped
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-siapsiaga_friend}
      MYSQL_USER: ${DB_USERNAME:-siapsiaga}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  app_storage:
